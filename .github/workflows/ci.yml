name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned website dependencies
        run: npm ci --ignore-scripts

      - name: Verify evidence display contract
        run: npm test

      - name: Typecheck Convex functions
        run: npm run typecheck:backend

      - name: Build React website
        run: npm run build


  repository-checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tracked files for whitespace errors
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Download and verify actionlint
        # Pins come from https://github.com/rhysd/actionlint/releases/tag/v1.7.12.
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --tlsv1.2 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint

      - name: Lint GitHub Actions workflows
        run: '"$RUNNER_TEMP/actionlint" -color'

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository and full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download and verify Gitleaks
        # Use the open-source CLI; no Gitleaks Action license or extra secret.
        # Pins come from https://github.com/gitleaks/gitleaks/releases/tag/v8.30.1.
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan Git history with secrets redacted
        run: '"$RUNNER_TEMP/gitleaks" git --redact --log-opts="--all" .'

      - name: Verify optional staged scanner
        run: PATH="$RUNNER_TEMP:$PATH" python3 -m unittest discover -s tests -p 'test_optional_tooling.py' -v
