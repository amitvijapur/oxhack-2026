title = "OXHack secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "The swarm judge cache key is a SHA-256 prompt fingerprint, not a credential"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^swarm/records/judge_cache\.jsonl$''']
regexTarget = "match"
regexes = ['''^key"\s*:\s*"[0-9a-f]{64}"$''']
